name: Python Lint

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  codecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked

      - name: Check linter with ruff and pyright
        run: uv run poe lint