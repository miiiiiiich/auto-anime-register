[project]
name = "auto-anime-register"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.2,<3",
    "fire>=0.7.0,<0.8",
    "tqdm>=4.67.0,<5",
    "requests>=2.32.3,<3",
    "notion-client>=2.2.1,<3",
    "pydantic-settings>=2.6.1,<3",
    "questionary>=2.0.1,<3",
    "loguru>=0.7.2,<0.8",
]

[dependency-groups]
dev = [
    "ruff>=0.7.4,<0.8",
    "pyright>=1.1.389,<2",
    "poethepoet>=0.30.0,<0.31",
    "pytest>=8.3.3,<9",
]

[tool.poe.tasks.give]
help = "When my anime list is empty, then give anime information"
cmd = "python src/main.py give"
[tool.poe.tasks.update]
help = "Update my anime list information in Notion"
cmd = "python src/main.py update"

[tool.poe.tasks."lint"]
help = "Fix all files format in the current directory"
shell = "ruff format --check . && ruff check --diff . && pyright"

[tool.poe.tasks.fmt]
help = "Format all files in the current directory"
shell = "ruff format . && ruff check --fix . "

[tool.ruff]
line-length = 88
indent-width = 4
cache-dir = "./cache/ruff"
extend-exclude = ["**/typings/**", "wip/**", '.pyenv/**']
fix = true
respect-gitignore = true
show-fixes = true
target-version = "py312"
unsafe-fixes = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "N", "W", "I"]
ignore = ["E501", "N815"]
exclude = []
per-file-ignores = { }
logger-objects = []
typing-modules = ["typings", "typing_extensions"]

[tool.pyright]
pythonVersion = "3.12"
exclude = [
    "**/__pycache__",
    "src/typings",
    "**/wip/**",
    "hpe/**",
    ".venv/**",
    "server/**",
    "typings/**",

]

stubPath = "src/typings"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]